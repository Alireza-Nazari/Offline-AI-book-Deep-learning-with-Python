<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deep Learning with Python — Companion</title>
<link rel="stylesheet" href="assets/math/katex.min.css">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%234a7bd0'/><text x='8' y='12' font-size='10' text-anchor='middle' fill='white' font-family='sans-serif'>DL</text></svg>">
</head>
<body>
<header id="topbar">
  <div class="brand"><span class="logo">DL</span><span class="title">Deep Learning with Python <small>3rd ed. · companion</small></span></div>
  <div class="nav">
    <select id="chapter-select" title="Jump to chapter"></select>
    <button id="btn-prev" class="icon" title="Previous page (←)">◀</button>
    <label class="pageinput">PDF p. <input id="page-input" type="number" min="1" value="1"> <span id="page-total"></span>
      <span id="printed-label" title="Printed page number"></span></label>
    <button id="btn-next" class="icon" title="Next page (→)">▶</button>
    <label class="sync"><input type="checkbox" id="sync-toggle" checked> sync panels</label>
  </div>
  <div class="tools">
    <input id="global-search" type="search" placeholder="Search the book & notes… (/)" autocomplete="off">
    <button id="btn-graph" title="Knowledge graph">Graph</button>
    <button id="btn-quiz" title="Quiz">Quiz</button>
    <button id="btn-chapters" title="Chapter overviews">Chapters</button>
    <button id="btn-theme" class="icon" title="Toggle dark / light">◐</button>
    <button id="btn-help" class="icon" title="Keyboard shortcuts & about">?</button>
  </div>
</header>

<main id="workspace">
  <section id="left" class="panel">
    <div class="panel-head">
      <nav id="note-nav"></nav>
      <input id="note-search" type="search" placeholder="Find in these notes…">
    </div>
    <div id="notes" class="panel-body"><div class="placeholder">Loading…</div></div>
  </section>
  <div id="divider" title="Drag to resize"></div>
  <section id="right" class="panel">
    <div class="panel-head viewer-toolbar">
      <button id="btn-thumbs" class="icon" title="Thumbnails">▤</button>
      <button id="btn-zoom-out" class="icon" title="Zoom out (-)">−</button>
      <span id="zoom-label">100%</span>
      <button id="btn-zoom-in" class="icon" title="Zoom in (+)">+</button>
      <button id="btn-fit-width" title="Fit width">Fit width</button>
      <button id="btn-fit-page" title="Fit page">Fit page</button>
      <input id="pdf-search" type="search" placeholder="Find in book…">
      <span id="pdf-search-status"></span>
      <button id="btn-pdf-prev" class="icon" title="Previous match">↑</button>
      <button id="btn-pdf-next" class="icon" title="Next match">↓</button>
      <button id="btn-fullscreen" class="icon" title="Full screen (f)">⛶</button>
    </div>
    <div id="viewer-wrap">
      <aside id="thumbs" hidden></aside>
      <div id="viewer" class="panel-body"><div id="pages"></div></div>
    </div>
  </section>
</main>

<div id="modal" hidden><div id="modal-card"><button id="modal-close" class="icon" title="Close (Esc)">✕</button><div id="modal-body"></div></div></div>
<div id="toast" hidden></div>

<script src="assets/pdfjs/pdf.min.js"></script>
<script src="assets/math/katex.min.js"></script>
<script src="assets/math/auto-render.min.js"></script>
<script src="assets/vendor/marked.min.js"></script>
<script src="assets/vendor/purify.min.js"></script>
<script src="assets/vendor/minisearch.umd.js"></script>
<script src="assets/vendor/chart.umd.js"></script>
<script src="assets/vendor/d3.min.js"></script>
<script src="assets/vendor/mermaid.min.js"></script>
<script src="assets/js/widgets/widgets.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
